<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MW Automotive</title>
  <style>
[hidden]{display:none!important}
:root{--fundo:#0e1515;--sup:#162020;--sup2:#1d2a2a;--borda:rgba(255,255,255,.09);--texto:#f2efe8;--suave:#9db0ac;--amarelo:#fcd34a;--amarelo2:#e9b60f;--prata:#cfd8dc;--ok:#46d39a;--erro:#ff6b5e;--raio:16px;--sombra:0 14px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--texto);line-height:1.5;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(252,211,74,.10),transparent 60%),radial-gradient(700px 500px at -5% 105%,rgba(92,200,255,.07),transparent 60%),var(--fundo);background-attachment:fixed}
h1,h2,h3,p{margin:0}
a{color:var(--amarelo)}
.suave{color:var(--suave)}.centro{text-align:center}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:0;border-radius:12px;font:inherit;font-weight:800;color:#1a1a10;cursor:pointer;background:linear-gradient(135deg,var(--amarelo),var(--amarelo2));box-shadow:0 6px 18px rgba(252,211,74,.25);transition:.18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(252,211,74,.38)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-bloco{width:100%}
.btn-sec{color:var(--texto);background:rgba(255,255,255,.06);border:1px solid var(--borda);box-shadow:none}
.btn-sec:hover{background:rgba(255,255,255,.12);box-shadow:none}
label{display:block;font-weight:600;margin:16px 0 6px;font-size:.88rem;color:var(--prata)}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--borda);border-radius:12px;background:rgba(255,255,255,.05);color:var(--texto);font:inherit;transition:.15s}
select option{background:#162020}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--amarelo)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--amarelo);box-shadow:0 0 0 3px rgba(252,211,74,.18)}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-brand{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:48px;background:linear-gradient(145deg,#1d2e2e,#0e1515 70%);border-right:1px solid var(--borda)}
.login-logo{position:relative;z-index:2;width:min(460px,82%);filter:drop-shadow(0 12px 30px rgba(0,0,0,.55));animation:flutuar 6s ease-in-out infinite}
.slogan{position:relative;z-index:2;color:var(--prata);letter-spacing:.16em;text-transform:uppercase;font-size:.78rem;text-align:center}
.selos{position:relative;z-index:2;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;list-style:none;margin:6px 0 0;padding:0}
.selos li{padding:6px 14px;border-radius:99px;font-size:.8rem;font-weight:600;color:var(--amarelo);background:rgba(252,211,74,.1);border:1px solid rgba(252,211,74,.25)}
.flake{position:absolute;width:780px;right:-230px;bottom:-250px;color:rgba(255,255,255,.055);animation:girar 90s linear infinite}
.glow{position:absolute;border-radius:50%;filter:blur(75px);opacity:.55;animation:deriva 12s ease-in-out infinite alternate}
.g1{width:330px;height:330px;background:rgba(252,211,74,.35);top:-90px;left:-70px}
.g2{width:380px;height:380px;background:rgba(92,200,255,.22);bottom:-130px;left:30%;animation-delay:-5s}
.login-form-wrap{display:grid;place-items:center;padding:28px}
.login-card{width:100%;max-width:410px;padding:38px 32px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid var(--borda);backdrop-filter:blur(14px);box-shadow:var(--sombra);animation:subir .6s both}
.login-card h1{font-size:1.7rem;margin-bottom:4px}
.msg-erro{color:var(--erro);min-height:1.4em;margin:12px 0 8px;font-size:.9rem}

/* ---------- ESTRUTURA ---------- */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.lateral{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;padding:20px 14px;background:linear-gradient(180deg,#131c1c,#0b1111);border-right:1px solid var(--borda)}
.logo-menu{width:100%;padding:4px 10px 16px;border-bottom:1px solid var(--borda)}
#menu{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
#menu a{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--suave);text-decoration:none;font-weight:600;transition:.15s}
#menu a:hover{background:rgba(255,255,255,.06);color:var(--texto);transform:translateX(3px)}
#menu a.ativo{color:var(--amarelo);background:linear-gradient(90deg,rgba(252,211,74,.17),rgba(252,211,74,.02))}
#menu a.ativo::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--amarelo);box-shadow:0 0 14px var(--amarelo)}
.usuario{display:grid;grid-template-columns:42px 1fr;gap:0 12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--borda)}
.avatar{grid-row:span 2;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a1a10;background:linear-gradient(135deg,var(--amarelo),var(--amarelo2))}
#usuario-nome{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usuario small{color:var(--suave)}
.usuario .btn{grid-column:1/-1;margin-top:12px;padding:9px}
.principal{min-width:0}
.topo{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:16px 32px;background:rgba(14,21,21,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--borda)}
.topo h1{font-size:1.25rem}
.data-topo{margin-left:auto;color:var(--suave);font-size:.88rem;display:inline-block}
.data-topo::first-letter{text-transform:uppercase}
.btn-menu{display:none;background:none;border:0;color:var(--texto);cursor:pointer;padding:0}
.btn-menu .ico{width:28px;height:28px}
.conteudo{padding:28px 32px 56px;max-width:1180px}
.fundo{display:none}

/* ---------- PAINEL ---------- */
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 34px;border-radius:24px;background:linear-gradient(120deg,#243a3a,#142020 60%,#2c2a12);border:1px solid var(--borda);animation:subir .5s both}
.hero h2{font-size:1.9rem;margin:8px 0 2px}
.hero p{color:var(--suave)}
.hero-tag{display:inline-block;padding:3px 12px;border-radius:99px;background:rgba(252,211,74,.14);color:var(--amarelo);font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.ico-grande{width:112px;height:112px;stroke-width:1.1;color:var(--amarelo);filter:drop-shadow(0 0 22px rgba(252,211,74,.6));animation:pulsar 2.6s ease-in-out infinite}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:16px;margin:20px 0}
.kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:20px;border-radius:var(--raio);background:var(--sup);border:1px solid var(--borda);text-decoration:none;color:var(--suave);transition:.2s;animation:subir .5s both}
.kpi:nth-child(2){animation-delay:.07s}.kpi:nth-child(3){animation-delay:.14s}.kpi:nth-child(4){animation-delay:.21s}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--cor)}
.kpi:hover{transform:translateY(-4px);border-color:var(--cor);box-shadow:0 16px 34px rgba(0,0,0,.4)}
.kpi-icone{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;color:var(--cor);background:color-mix(in srgb,var(--cor) 16%,transparent)}
.kpi strong{font-size:2.5rem;line-height:1;color:var(--texto)}
.painel-card{padding:22px;border-radius:var(--raio);background:var(--sup);border:1px solid var(--borda);margin-bottom:20px;animation:subir .6s .2s both}
.painel-titulo{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.painel-titulo h3{font-size:1.05rem}
.barra{display:flex;gap:3px;height:14px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.07)}
.barra span{background:var(--cor);min-width:6px}
.etapas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.etapa{padding:12px 14px;border-radius:12px;background:var(--sup2);border-left:4px solid var(--cor)}
.etapa strong{display:block;font-size:1.5rem;line-height:1.2}
.etapa span{color:var(--suave);font-size:.84rem}
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.atalho{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;background:var(--sup);border:1px dashed rgba(252,211,74,.35);color:var(--texto);text-decoration:none;font-weight:600;transition:.2s}
.atalho:hover{background:rgba(252,211,74,.1);border-style:solid;transform:translateY(-2px)}
.atalho .ico{color:var(--amarelo)}

/* ---------- COMPONENTES ---------- */
.aviso{background:var(--sup);border:1px solid var(--borda);border-left:4px solid var(--amarelo);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.aviso.erro{border-left-color:var(--erro)}
.vazio{text-align:center;padding:70px 20px}
.vazio .ico{width:64px;height:64px;color:var(--amarelo);stroke-width:1.2;margin-bottom:10px}
.tabela-wrap{overflow-x:auto;background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio)}
.tabela{width:100%;border-collapse:collapse;min-width:520px}
.tabela th,.tabela td{padding:10px 14px;border-bottom:1px solid var(--borda);text-align:left}
.tabela th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--suave)}
.tabela tr:last-child td{border-bottom:0}
.tabela .centro{text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ok);color:#06231a;font-weight:700;padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:var(--sombra)}
.toast.erro{background:var(--erro);color:#fff}
.toast.visivel{opacity:1;transform:translate(-50%,0)}

.barra-ferr{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.barra-ferr input{flex:1;min-width:200px;width:auto}.barra-ferr .btn{white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 16px;border-radius:99px;border:1px solid var(--borda);background:transparent;color:var(--suave);font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{color:var(--texto)}.chip.ativo{background:rgba(252,211,74,.14);border-color:var(--amarelo);color:var(--amarelo)}
tr.clicavel{cursor:pointer;transition:.12s}tr.clicavel:hover{background:rgba(252,211,74,.07)}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--cor);background:color-mix(in srgb,var(--cor) 16%,transparent)}
.modal-fundo{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);display:grid;place-items:start center;overflow-y:auto;padding:30px 14px;animation:subir .2s both}
.modal{width:100%;max-width:640px;border-radius:20px;background:var(--sup);border:1px solid var(--borda);box-shadow:var(--sombra)}
.modal.largo{max-width:1000px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--borda)}
.modal .x{background:none;border:0;color:var(--suave);font-size:1.9rem;line-height:1;cursor:pointer}.modal .x:hover{color:var(--amarelo)}
.modal-corpo{padding:6px 22px 24px}
.modal h4{margin:24px 0 10px;color:var(--amarelo);font-size:.82rem;text-transform:uppercase;letter-spacing:.08em}
.grade-form{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}.campo.larga{grid-column:1/-1}
.acoes{display:flex;gap:10px;margin-top:24px;align-items:center;flex-wrap:wrap}
.btn-perigo{background:rgba(255,107,94,.14);color:var(--erro);box-shadow:none;border:1px solid rgba(255,107,94,.4)}.btn-perigo:hover{background:rgba(255,107,94,.25);box-shadow:none}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.checks label{display:flex;align-items:center;gap:10px;margin:0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-weight:500;color:var(--texto);cursor:pointer}
.tabela.itens{min-width:880px}.itens td{padding:6px 8px}.itens input,.itens select{padding:8px 10px}.itens .num{width:92px}
.x-linha{background:none;border:0;color:var(--erro);font-size:1.5rem;line-height:1;cursor:pointer}
.acoes-item{display:flex;gap:10px;margin:12px 0}.acoes-item .btn{padding:9px 14px}
.totais{margin:18px 0 0 auto;max-width:320px;display:grid;gap:5px}.totais div{display:flex;justify-content:space-between}
.totais .geral{font-size:1.35rem;font-weight:800;color:var(--amarelo);border-top:1px solid var(--borda);padding-top:8px}
@media(max-width:860px){.grade-form{grid-template-columns:1fr}.modal-fundo{padding:0}.modal{border-radius:0;min-height:100vh}.modal-corpo{padding:6px 14px 24px}}

.btn-whats{background:linear-gradient(135deg,#25d366,#128c4a);color:#04200f;box-shadow:0 6px 18px rgba(37,211,102,.25)}
.estq-topo{margin:14px 0 4px}.estq-topo strong{display:block;font-size:2rem;line-height:1.2;color:var(--amarelo)}
.pos{color:var(--ok)}.neg{color:var(--erro)}.alerta{border-color:var(--erro)!important}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.leg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 6px 0 12px}
.graf{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;height:190px}
.col{display:flex;flex-direction:column;cursor:pointer;padding:6px 4px 4px;border-radius:12px;transition:.15s}.col:hover{background:rgba(255,255,255,.04)}
.col.sel{background:rgba(252,211,74,.08)}
.barras{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5px}
.barras span{width:36%;max-width:34px;min-height:3px;border-radius:6px 6px 0 0;transition:height .6s}
.b-rec{background:var(--amarelo)}.b-desp{background:#ff9f45}
.col small{text-align:center;color:var(--suave);margin-top:6px;text-transform:capitalize}.col.sel small{color:var(--amarelo);font-weight:700}
.linha-bar{display:grid;grid-template-columns:140px 1fr 110px;gap:10px;align-items:center;margin:9px 0;font-size:.92rem}
.linha-bar div{height:10px;border-radius:99px;background:rgba(255,255,255,.07)}.linha-bar i{display:block;height:100%;border-radius:99px;background:var(--cor)}.linha-bar b{text-align:right}
.resumo-rec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.resumo-rec div{padding:12px;border-radius:12px;background:var(--sup2);display:flex;flex-direction:column}
.resumo-rec span{color:var(--suave);font-size:.8rem}.resumo-rec b{font-size:1.15rem}.resumo-rec .destaque{color:var(--amarelo)}
.pix-box{display:flex;gap:16px;align-items:flex-start;margin-top:16px;padding:14px;border-radius:14px;background:var(--sup2);border:1px dashed rgba(252,211,74,.4);flex-wrap:wrap}
.pix-box .qr{background:#fff;padding:8px;border-radius:10px;min-width:150px;min-height:150px;display:grid;place-items:center;color:#333;font-size:.8rem;text-align:center}
.pix-box .qr img{display:block;width:170px;height:170px;image-rendering:pixelated}
.pix-box>div:last-child{flex:1;min-width:220px}.pix-box textarea{font-size:.74rem;word-break:break-all;margin:6px 0 10px}.pix-box .btn{margin-right:8px;padding:9px 14px}
@media(max-width:860px){.duas{grid-template-columns:1fr}.linha-bar{grid-template-columns:100px 1fr 90px}}
@keyframes flutuar{50%{transform:translateY(-8px)}}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes deriva{to{transform:translate(60px,40px) scale(1.15)}}
@keyframes subir{from{opacity:0;transform:translateY(16px)}}
@keyframes pulsar{50%{opacity:.7;transform:scale(.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:860px){
  .login-wrap{grid-template-columns:1fr}
  .login-brand{padding:30px 20px;gap:12px;border-right:0;border-bottom:1px solid var(--borda)}
  .login-logo{width:min(250px,70%)}.selos{display:none}
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;left:-285px;top:0;width:262px;z-index:30;transition:left .22s}
  .lateral.aberta{left:0}
  .fundo.visivel{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
  .btn-menu{display:block}
  .topo,.conteudo{padding-left:16px;padding-right:16px}
  .data-topo{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:12px}.kpi{padding:16px}.kpi strong{font-size:2rem}.kpi-icone{width:38px;height:38px;margin-bottom:8px}
  .hero{padding:22px}.ico-grande{width:70px;height:70px}.hero h2{font-size:1.5rem}
}
  </style>
</head>
<body>
  <main class="login-wrap" id="tela-login" hidden>
    <section class="login-brand">
      <div class="glow g1"></div><div class="glow g2"></div>
      <svg class="flake" viewBox="-100 -100 200 200" aria-hidden="true">
        <defs><g id="braco"><path d="M0 0V-92M0 -64l-17-17M0 -64l17-17M0 -40l-13-13M0 -40l13-13" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></g></defs>
        <use href="#braco"/><use href="#braco" transform="rotate(60)"/><use href="#braco" transform="rotate(120)"/>
        <use href="#braco" transform="rotate(180)"/><use href="#braco" transform="rotate(240)"/><use href="#braco" transform="rotate(300)"/>
      </svg>
      <img data-logo class="login-logo" alt="Logo da oficina">
      <p class="slogan" id="nome-oficina-login"></p>
      <ul class="selos"><li>Ordens de serviço</li><li>Estoque</li><li>Financeiro</li><li>Lembretes de revisão</li></ul>
    </section>
    <section class="login-form-wrap">
      <div class="login-card">
        <h1>Bem-vindo de volta</h1>
        <p class="suave">Entre para acessar o sistema da oficina</p>
        <form id="form-login">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" required>
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required>
          <p id="msg" class="msg-erro" role="alert"></p>
          <button id="btn-entrar" class="btn btn-bloco" type="submit">Entrar</button>
        </form>
      </div>
    </section>
  </main>

  <div class="app" id="tela-app" hidden>
    <aside class="lateral" id="lateral">
      <img data-logo class="logo-menu" alt="Logo da oficina">
      <nav id="menu" aria-label="Menu principal"></nav>
      <div class="usuario">
        <div class="avatar" id="avatar"></div>
        <div id="usuario-nome"></div>
        <small id="usuario-papel"></small>
        <button id="btn-sair" class="btn btn-sec" type="button">Sair</button>
      </div>
    </aside>
    <div class="fundo" id="fundo"></div>
    <main class="principal">
      <header class="topo">
        <button id="btn-menu" class="btn-menu" type="button" aria-label="Abrir menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 id="titulo-pagina"></h1>
        <span class="data-topo" id="data-topo"></span>
      </header>
      <section id="conteudo" class="conteudo">Carregando…</section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- ============ CONFIGURAÇÃO: edite só este bloco ============ -->
  <script>
// =====================================================
// CONFIGURAÇÃO - edite apenas este arquivo
// =====================================================
window.CONFIG = {
  NOME_OFICINA: "MW Automotive",
  SLOGAN: "Mecânica • Elétrica • Ar-condicionado",

  // Dados que aparecem no cabeçalho do PDF (deixe "" o que não quiser mostrar)
  EMPRESA: { CNPJ: "", TELEFONE: "", EMAIL: "", ENDERECO: "" },
  // Texto no rodapé do orçamento/OS (revise com as regras da sua oficina)
  TERMOS: "Valores sujeitos a alteração caso sejam encontrados problemas adicionais, mediante aprovação do cliente. A garantia cobre os serviços e peças descritos, nos prazos informados.",

  <script>
// Cria a conexão com o Supabase (usada por todas as telas como "sb")
(function () {
  const { createClient } = window.supabase;
  window.sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
})();

// Funções de apoio usadas em todo o sistema
window.MODULOS = {};

window.esc = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

window.brl = (n) =>
  Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

window.dataBR = (d) => {
  if (!d) return "";
  const txt = String(d);
  const dt = new Date(txt.length === 10 ? txt + "T00:00:00" : txt);
  return dt.toLocaleDateString("pt-BR");
};

window.toast = (msg, tipo = "ok") => {

  if (!el) return;
  el.textContent = msg;
  el.className = "toast " + tipo + " visivel";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => (el.className = "toast"), 3000);
};

function mostrarLogin(aviso) {
  document.getElementById("tela-app").hidden = true;
  document.getElementById("tela-login").hidden = false;
  document.title = CONFIG.NOME_OFICINA + " - Entrar";
  document.getElementById("nome-oficina-login").textContent = CONFIG.SLOGAN || "";
  const msg = document.getElementById("msg");
  if (!configuradoOk()) {
    msg.textContent = "Falta configurar a URL e a chave do Supabase no topo do arquivo index.html.";
    document.getElementById("btn-entrar").disabled = true;
  } else if (aviso) {
    msg.textContent = aviso;
  }
}

function traduzirErro(m) {
  if (/invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/email not confirmed/i.test(m)) return "E-mail ainda não confirmado.";
  return "Não foi possível entrar: " + m;
}

document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn-entrar");
  const msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Entrando..."; msg.textContent = "";
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("senha").value,
  });
  if (error) {
    msg.textContent = traduzirErro(error.message);
    btn.disabled = false; btn.textContent = "Entrar";
    return;
  }
  location.reload();
});

          <div class="kpi-icone">${svg(k.ic)}</div><strong data-alvo="${k.v}">0</strong><span>${esc(k.t)}</span>

      </section>

      const alvo = Number(s.dataset.alvo);

      const passo = (t) => {
        const p = Math.min((t - ini) / 900, 1);

window.modal = (titulo, corpo, largo) => {
  const d = document.createElement("div");
  d.className = "modal-fundo";
  d.innerHTML = `<div class="modal ${largo ? "largo" : ""}"><header><h3>${esc(titulo)}</h3><button class="x" type="button" aria-label="Fechar">×</button></header><div class="modal-corpo">${corpo}</div></div>`;
  document.body.appendChild(d);
  d.fechar = () => d.remove();
  d.querySelector(".x").onclick = d.fechar;
  d.addEventListener("mousedown", (e) => { if (e.target === d) d.fechar(); });
  return d;
};
const erroAmigavel = (e) =>
  e.code === "23505" ? "Já existe um cadastro com esses dados (ex.: placa ou código repetido)."
  : e.code === "23503" ? "Não é possível excluir: há registros ligados a este."
  : "Não foi possível salvar: " + e.message;

function campoHtml(c, v, extra) {
  const id = "f_" + c.k, val = v ?? "";
  let ctl;
  if (c.tipo === "textarea") ctl = `<textarea id="${id}" rows="${c.linhas || 3}">${esc(val)}</textarea>`;
  else if (c.tipo === "select") {
    const ops = typeof c.opcoes === "function" ? c.opcoes(extra) : c.opcoes;
    ctl = `<select id="${id}"><option value="">Selecione…</option>${ops.map(([a, b]) =>
      `<option value="${esc(a)}" ${String(a) === String(val) ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>`;
  } else ctl = `<input id="${id}" type="${c.tipo || "text"}" value="${esc(val)}">`;
  return `<div class="campo ${c.larga ? "larga" : ""}"><label for="${id}">${esc(c.t)}${c.req ? " *" : ""}</label>${ctl}</div>`;
}
function lerCampos(campos, raiz) {
  const o = {};
  campos.forEach((c) => {
    let v = raiz.querySelector("#f_" + c.k).value.trim();
    if (c.up) v = v.toUpperCase();
    o[c.k] = v === "" ? null : c.tipo === "number" ? Number(v) : v;
  });
  return o;
}

// Cadastro genérico (lista + busca + formulário), usado por clientes e veículos
function crud(cfg) {
  return {
    async render(el, ctx) {
      const editar = ["dono", "atendente"].includes(ctx.perfil.papel);
      const extra = cfg.carregar ? await cfg.carregar() : {};
      let linhas = [];
      const carregar = async () => {
        const { data, error } = await sb.from(cfg.tabela).select(cfg.select || "*").order(cfg.ordem);
        if (error) throw error;
        linhas = data;
      };
      await carregar();
      el.innerHTML = `<div class="barra-ferr"><input id="busca" type="search" placeholder="Buscar ${cfg.titulo.toLowerCase()}…">
        ${editar ? `<button class="btn" id="novo">+ Novo ${cfg.singular}</button>` : ""}</div>
        <div class="tabela-wrap"><table class="tabela"><thead><tr>${cfg.colunas.map((c) => `<th>${c.t}</th>`).join("")}</tr></thead><tbody id="corpo"></tbody></table></div>`;
      const corpo = el.querySelector("#corpo");
      const desenhar = () => {
        const q = el.querySelector("#busca").value.toLowerCase().trim();
        const vis = linhas.filter((l) => !q || JSON.stringify(l).toLowerCase().includes(q));
        corpo.innerHTML = vis.length
          ? vis.map((l) => `<tr class="clicavel" data-id="${l.id}">${cfg.colunas.map((c) => `<td>${c.f ? c.f(l) : esc(l[c.k] ?? "")}</td>`).join("")}</tr>`).join("")
          : `<tr><td colspan="${cfg.colunas.length}" class="suave centro">Nada cadastrado ainda.</td></tr>`;
      };
      const abrir = (reg) => {
        const m = modal((reg ? "Editar " : "Novo ") + cfg.singular,
          `<div class="grade-form">${cfg.campos.map((c) => campoHtml(c, reg?.[c.k], extra)).join("")}</div>
          <div class="acoes">${reg && ctx.perfil.papel === "dono" ? '<button class="btn btn-perigo" id="apagar" type="button">Excluir</button>' : ""}
          <span style="flex:1"></span><button class="btn btn-sec" id="cancelar" type="button">Cancelar</button><button class="btn" id="salvar" type="button">Salvar</button></div>`);
        m.querySelector("#cancelar").onclick = m.fechar;
        m.querySelector("#salvar").onclick = async () => {
          const dados = lerCampos(cfg.campos, m);
          const falta = cfg.campos.find((c) => c.req && dados[c.k] == null);
          if (falta) { toast("Preencha: " + falta.t, "erro"); return; }
          const { error } = reg ? await sb.from(cfg.tabela).update(dados).eq("id", reg.id) : await sb.from(cfg.tabela).insert(dados);
          if (error) { toast(erroAmigavel(error), "erro"); return; }
          toast("Salvo!"); m.fechar(); await carregar(); desenhar();
        };
        const ap = m.querySelector("#apagar");
        if (ap) ap.onclick = async () => {
          if (!confirm("Excluir este cadastro?")) return;
          const { error } = await sb.from(cfg.tabela).delete().eq("id", reg.id);
          if (error) { toast(erroAmigavel(error), "erro"); return; }
          toast("Excluído."); m.fechar(); await carregar(); desenhar();
        };
      };
      el.querySelector("#busca").oninput = desenhar;
      corpo.onclick = (e) => { const tr = e.target.closest("tr[data-id]"); if (tr && editar) abrir(linhas.find((l) => l.id === tr.dataset.id)); };
      if (editar) el.querySelector("#novo").onclick = () => abrir(null);
      desenhar();
    },
  };
}

  ["aguardando_peca", "Aguardando peça", "#c58cff"], ["concluido", "Concluído", "#46d39a"], ["entregue", "Entregue", "#9db0ac"], ["cancelado", "Cancelado", "#ff6b5e"]];

const GRUPOS_OS = { abertas: ["orcamento", "aprovado", "em_andamento", "aguardando_peca"], prontas: ["concluido"], entregues: ["entregue"], todas: null };

        <h4>Serviços e peças</h4>
        <div class="tabela-wrap"><table class="tabela itens"><thead><tr><th>Tipo</th><th>Do catálogo</th><th>Descrição</th><th>Qtd</th><th>Valor un.</th><th>Garantia (dias)</th><th>Total</th><th></th></tr></thead><tbody id="itens"></tbody></table></div>
        <div class="acoes-item"><button class="btn btn-sec" id="add-srv" type="button">+ Serviço</button><button class="btn btn-sec" id="add-prd" type="button">+ Peça</button></div>
        <div class="grade-form"><div class="campo larga"><label>Observações</label><textarea id="f_obs" rows="2">${esc(o.observacoes)}</textarea></div>
          <div class="campo"><label>Desconto (R$)</label><input id="f_desc" type="number" step="0.01" min="0" value="${o.desconto ?? 0}"></div></div>
        <div class="totais"><div><span>Subtotal</span><span id="t-sub"></span></div><div class="geral"><span>Total</span><span id="t-total"></span></div>
          ${os ? `<div><span>Pago</span><span id="t-pago">${brl(o.pago)}</span></div><div><span>Saldo</span><span id="t-saldo"></span></div>` : ""}</div>
        <div class="acoes">${os && papel === "dono" ? '<button class="btn btn-perigo" id="apagar" type="button">Excluir OS</button>' : ""}<span style="flex:1"></span>
          ${os && editaTudo ? '<button class="btn btn-sec" id="receber-btn" type="button">Receber</button>' : ""}
          ${os ? '<button class="btn btn-sec" id="imprimir" type="button">PDF / Imprimir</button><button class="btn btn-whats" id="whats" type="button">WhatsApp</button>' : ""}
          <button class="btn btn-sec" id="cancelar" type="button">Fechar</button><button class="btn" id="salvar" type="button">Salvar OS</button></div>`, true);

      const $ = (s) => m.querySelector(s);
      const pick = (it) => `<option value="">— Avulso —</option>` + (it.tipo === "servico"
        ? servicos.map((s) => `<option value="s:${s.id}" ${it.servico_id === s.id ? "selected" : ""}>${esc(s.nome)}</option>`).join("")
        : produtos.map((p) => `<option value="p:${p.id}" ${it.produto_id === p.id ? "selected" : ""}>${esc((p.codigo ? p.codigo + " · " : "") + p.nome)} (estoque ${p.qtd_estoque})</option>`).join(""));
      const calc = () => {
        const sub = itens.reduce((s, i) => s + Number(i.quantidade || 0) * Number(i.valor_unitario || 0), 0);
        const total = sub - Number($("#f_desc").value || 0);
        $("#t-sub").textContent = brl(sub); $("#t-total").textContent = brl(total);
        if ($("#t-saldo")) $("#t-saldo").textContent = brl(total - Number(o.pago || 0));
        if ($("#t-pago")) $("#t-pago").textContent = brl(o.pago || 0);
        m.querySelectorAll("tr[data-i] .tot").forEach((td) => {
          const i = itens[td.parentNode.dataset.i]; td.textContent = brl(i.quantidade * i.valor_unitario);
          const pr = i.produto_id && produtos.find((x) => x.id === i.produto_id), q = td.parentNode.querySelector("[data-c=quantidade]");
          q.classList.toggle("alerta", !!pr && i.quantidade > pr.qtd_estoque);
          q.title = pr && i.quantidade > pr.qtd_estoque ? `Estoque insuficiente: só há ${pr.qtd_estoque}` : "";
        });
      };
      const linhasItens = () => {
        $("#itens").innerHTML = itens.length ? itens.map((it, i) => `<tr data-i="${i}"><td>${it.tipo === "servico" ? "Serviço" : "Peça"}</td>
          <td><select data-c="pick">${pick(it)}</select></td><td><input data-c="descricao" value="${esc(it.descricao)}"></td>
          <td><input class="num" data-c="quantidade" type="number" step="0.01" min="0.01" value="${it.quantidade}"></td>
          <td><input class="num" data-c="valor_unitario" type="number" step="0.01" min="0" value="${it.valor_unitario}"></td>
          <td><input class="num" data-c="garantia_dias" type="number" min="0" value="${it.garantia_dias ?? ""}"></td>
          <td class="tot"></td><td><button class="x-linha" data-c="rem" type="button" aria-label="Remover">×</button></td></tr>`).join("")
          : '<tr><td colspan="8" class="suave centro">Nenhum item ainda. Use os botões abaixo.</td></tr>';
        calc();
      };
      const novoItem = (tipo) => { itens.push({ tipo, produto_id: null, servico_id: null, descricao: "", quantidade: 1, valor_unitario: 0, garantia_dias: null, garantia_km: null }); linhasItens(); };
      $("#add-srv").onclick = () => novoItem("servico");
      $("#add-prd").onclick = () => novoItem("peca");
      $("#itens").addEventListener("input", (e) => {
        const c = e.target.dataset.c, i = e.target.closest("tr")?.dataset.i;
        if (!c || c === "pick" || i == null) return;
        itens[i][c] = e.target.type === "number" ? (e.target.value === "" ? null : Number(e.target.value)) : e.target.value;
        calc();
      });
      $("#itens").addEventListener("change", (e) => {
        if (e.target.dataset.c !== "pick") return;
        const it = itens[e.target.closest("tr").dataset.i], [t, id] = e.target.value.split(":");
        if (t === "s") { const s = servicos.find((x) => x.id === id); Object.assign(it, { servico_id: id, produto_id: null, descricao: s.nome, valor_unitario: Number(s.preco_padrao), garantia_dias: s.garantia_dias, garantia_km: s.garantia_km }); }
        else if (t === "p") { const p = produtos.find((x) => x.id === id); Object.assign(it, { produto_id: id, servico_id: null, descricao: p.nome, valor_unitario: Number(p.preco_venda) }); }
        else Object.assign(it, { servico_id: null, produto_id: null });
        linhasItens();
      });
      $("#itens").addEventListener("click", (e) => { if (e.target.dataset.c === "rem") { itens.splice(e.target.closest("tr").dataset.i, 1); linhasItens(); } });
      $("#f_desc").oninput = calc;
      $("#f_cliente").onchange = (e) => { $("#f_veiculo").innerHTML = opt(opsVeic(e.target.value), "", e.target.value ? "Selecione…" : "Selecione o cliente primeiro"); };
      $("#cancelar").onclick = m.fechar;
      if (os) {
        const montarDoc = async () => {
          const [c, v] = await Promise.all([
            sb.from("clientes").select("*").eq("id", $("#f_cliente").value).maybeSingle(),
            sb.from("veiculos").select("*").eq("id", $("#f_veiculo").value).maybeSingle()]);
          return { cliente: c.data || {}, veiculo: v.data || {}, itens: itens.map((i) => ({ ...i, quantidade: Number(i.quantidade), valor_unitario: Number(i.valor_unitario || 0) })),
            mecanico: (mecs.find((x) => x.id === $("#f_mecanico").value) || {}).nome || "",
            os: { ...o, status: $("#f_status").value, km_entrada: $("#f_km").value, validade_orcamento: $("#f_validade").value, defeito_relatado: $("#f_defeito").value,
              diagnostico: $("#f_diag").value, observacoes: $("#f_obs").value, desconto: Number($("#f_desc").value || 0),
              checklist: { itens: [...m.querySelectorAll(".checks input:checked")].map((x) => x.value), combustivel: $("#f_comb").value } } };
        };
        if ($("#receber-btn")) $("#receber-btn").onclick = () => {
          const sub = itens.reduce((s, i) => s + Number(i.quantidade || 0) * Number(i.valor_unitario || 0), 0);
          receberOS({ id: o.id, numero: o.numero, status: o.status, clientes: o.clientes, veiculos: o.veiculos, total: sub - Number($("#f_desc").value || 0), pago: Number(o.pago || 0) },
            async () => { await carregar(); desenhar(); const f = linhas.find((x) => x.id === o.id); if (f) { o.pago = f.pago; calc(); } });
        };
        $("#imprimir").onclick = async () => {
          const w = window.open("", "_blank");
          if (!w) { toast("O navegador bloqueou a janela. Permita pop-ups para este site.", "erro"); return; }
          try { imprimirOS(await montarDoc(), w); } catch (e) { w.close(); toast("Erro ao gerar o documento: " + e.message, "erro"); }
        };
        $("#whats").onclick = async () => {
          const w = window.open("", "_blank");
          if (!w) { toast("O navegador bloqueou a janela. Permita pop-ups para este site.", "erro"); return; }
          try {
            const l = linkWhats(await montarDoc());
            if (!l.tel) toast("Cliente sem WhatsApp cadastrado. Escolha o contato manualmente.", "erro");
            w.location.href = l.url;
          } catch (e) { w.close(); toast("Erro ao montar a mensagem: " + e.message, "erro"); }
        };
      }
      linhasItens();

      if (papel === "contador") m.querySelectorAll("input,select,textarea,.x-linha,#add-srv,#add-prd,#salvar").forEach((x) => (x.disabled = true));
      if (papel === "mecanico") ["#f_cliente", "#f_veiculo", "#f_mecanico", "#f_desc", "#f_validade"].forEach((s) => ($(s).disabled = true));

      $("#salvar").onclick = async () => {
        const dados = { status: $("#f_status").value, diagnostico: $("#f_diag").value.trim() || null,
          checklist: { itens: [...m.querySelectorAll(".checks input:checked")].map((x) => x.value), combustivel: $("#f_comb").value || null } };
        if (editaTudo) Object.assign(dados, { cliente_id: $("#f_cliente").value || null, veiculo_id: $("#f_veiculo").value || null, mecanico_id: $("#f_mecanico").value || null,
          km_entrada: $("#f_km").value === "" ? null : Number($("#f_km").value), validade_orcamento: $("#f_validade").value || null,
          defeito_relatado: $("#f_defeito").value.trim() || null, desconto: Number($("#f_desc").value || 0), observacoes: $("#f_obs").value.trim() || null });
        if (editaTudo && (!dados.cliente_id || !dados.veiculo_id)) { toast("Escolha o cliente e o veículo.", "erro"); return; }
        if (itens.some((i) => !i.descricao.trim() || !(i.quantidade > 0))) { toast("Todo item precisa de descrição e quantidade.", "erro"); return; }
        const btn = $("#salvar"); btn.disabled = true; const antes = o.status;
        try {
          let osId = o.id;
          if (!os) { const r = await sb.from("ordens_servico").insert(dados).select("id").single(); if (r.error) throw r.error; osId = r.data.id; }
          const novos = itens.map((i) => ({ os_id: osId, tipo: i.tipo, produto_id: i.produto_id, servico_id: i.servico_id, descricao: i.descricao.trim(),
            quantidade: i.quantidade, valor_unitario: i.valor_unitario || 0, garantia_dias: i.garantia_dias || null, garantia_km: i.garantia_km || null }));
          if (novos.length) { const r = await sb.from("os_itens").insert(novos); if (r.error) throw r.error; }
          if (antigos.length) { const r = await sb.from("os_itens").delete().in("id", antigos); if (r.error) throw r.error; }
          if (os) { const r = await sb.from("ordens_servico").update(dados).eq("id", osId); if (r.error) throw r.error; }
          toast("OS salva!"); m.fechar(); await carregar(); desenhar();
          if (os && antes !== "concluido" && dados.status === "concluido" && editaTudo) await oferecerRecebimento(osId);
        } catch (e) { console.error(e); toast(erroAmigavel(e), "erro"); btn.disabled = false; }
      };
      const ap = $("#apagar");
      if (ap) ap.onclick = async () => {
        if (!confirm("Excluir esta OS e todos os seus itens?")) return;
        const { error } = await sb.from("ordens_servico").delete().eq("id", o.id);
        if (error) { toast(erroAmigavel(error), "erro"); return; }
        toast("OS excluída."); m.fechar(); await carregar(); desenhar();
      };
    };

    el.querySelector("#busca").oninput = desenhar;
    el.querySelector(".chips").onclick = (e) => {
      const b = e.target.closest("[data-f]"); if (!b) return;
      filtro = b.dataset.f; el.querySelectorAll(".chip").forEach((c) => c.classList.toggle("ativo", c === b)); desenhar();
    };
    corpo.onclick = (e) => { const tr = e.target.closest("tr[data-id]"); if (tr) abrir(linhas.find((l) => l.id === tr.dataset.id)); };
    if (editaTudo) el.querySelector("#nova").onclick = () => abrir(null);
    desenhar();
  },
};

function imprimirOS(d, w) {
  w.document.open(); w.document.write(docOS(d)); w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 700);
}

function msgWhats(d) {
  const { os, cliente: c, veiculo: v, itens } = d;
  const nome = (c.nome || "").split(" ")[0];
  const veic = [v.marca, v.modelo].filter(Boolean).join(" ") + (v.placa ? ` (${v.placa})` : "");
  const total = itens.reduce((s, i) => s + i.quantidade * i.valor_unitario, 0) - Number(os.desconto || 0);
  const lista = (t) => itens.filter((i) => i.tipo === t).map((i) => `• ${i.descricao} (${Number(i.quantidade)}x) - ${brl(i.quantidade * i.valor_unitario)}`).join("\n");
  let m = `*${CONFIG.NOME_OFICINA}*\nOlá, ${nome}! `;
  if (os.status === "orcamento") {
    m += `Segue o orçamento nº ${os.numero} do seu ${veic}:\n\n`;
    if (lista("servico")) m += `*Serviços*\n${lista("servico")}\n\n`;
    if (lista("peca")) m += `*Peças*\n${lista("peca")}\n\n`;
    if (os.desconto) m += `Desconto: ${brl(os.desconto)}\n`;
    m += `*Total: ${brl(total)}*\n`;
    if (os.validade_orcamento) m += `Válido até ${dataBR(os.validade_orcamento)}.\n`;
    m += "\nPara aprovar, é só responder esta mensagem. 👍";
  } else if (os.status === "aprovado") m += `Orçamento nº ${os.numero} aprovado! Vamos iniciar o serviço no seu ${veic}. 🔧`;
  else if (os.status === "em_andamento") m += `Seu ${veic} já está em atendimento (OS nº ${os.numero}). Assim que terminarmos, avisamos! 🔧`;
  else if (os.status === "aguardando_peca") m += `O serviço no seu ${veic} está aguardando a chegada de uma peça (OS nº ${os.numero}). Avisaremos assim que chegar.`;
  else if (os.status === "concluido") m += `Seu ${veic} está *pronto para retirada*! 🚗✅\nOS nº ${os.numero} - Total: *${brl(total)}*.`;
  else {
    m += `Obrigado pela preferência! Resumo da OS nº ${os.numero} do seu ${veic}: total *${brl(total)}*.`;
    const g = itens.filter((i) => i.garantia_dias).map((i) => `• ${i.descricao}: ${i.garantia_dias} dias`);
    if (g.length) m += `\n\n*Garantias*\n${g.join("\n")}`;
    m += "\n\nQualquer dúvida, estamos à disposição!";
  }
  return m;
}

function linkWhats(d) {
  const num = String(d.cliente.whatsapp || d.cliente.telefone || "").replace(/\D/g, "");
  const tel = num.length >= 10 ? (num.length <= 11 ? "55" + num : num) : "";
  return { tel, url: `https://wa.me/${tel}?text=${encodeURIComponent(msgWhats(d))}` };
}

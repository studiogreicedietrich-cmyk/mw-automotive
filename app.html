<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema da Oficina</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral">
      <div class="marca"><span>🔧</span><strong id="nome-oficina"></strong></div>
      <nav id="menu" aria-label="Menu principal"></nav>
      <div class="usuario">
        <div id="usuario-nome"></div>
        <small id="usuario-papel"></small>
        <button id="btn-sair" class="btn btn-sec btn-bloco" type="button">Sair</button>
      </div>
    </aside>
    <div class="fundo" id="fundo"></div>
    <main class="principal">
      <header class="topo">
        <button id="btn-menu" class="btn-menu" type="button" aria-label="Abrir menu">☰</button>
        <h1 id="titulo-pagina"></h1>
      </header>
      <section id="conteudo" class="conteudo">Carregando…</section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/modulos/painel.js"></script>
  <script src="js/modulos/equipe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
